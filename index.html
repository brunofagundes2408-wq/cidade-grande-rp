<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cidade Grande RP - Painel</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background: linear-gradient(135deg,#000000,#0a1a2f);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.container{
    background:#111;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 30px #00bfff50;
    width:350px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    outline:none;
}

button{
    width:100%;
    padding:10px;
    background:#00bfff;
    border:none;
    border-radius:8px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0080ff;
}

.painel{
    display:none;
}
</style>
</head>
<body>

<div class="container" id="login">
    <h2>Cidade Grande RP</h2>
    <p>Sistema Oficial de Recrutamento</p>

    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="login()">Entrar</button>
</div>

<div class="container painel" id="painel">
    <h2>👑 Painel de Dono</h2>
    <p id="bemvindo"></p>
    <p>Cargo: DONO</p>
</div>

<script>
function login(){
    const user = document.getElementById("usuario").value;
    const pass = document.getElementById("senha").value;

    const donos = ["Bruno","Leeh"];

    if(donos.includes(user) && pass === "BruuLeeh"){
        document.getElementById("login").style.display="none";
        document.getElementById("painel").style.display="block";
        document.getElementById("bemvindo").innerText="Bem-vindo(a), " + user + "!";
    } else {
        alert("Acesso negado!");
    }
}
</script>

</body>
</html>
