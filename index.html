<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Painel Cidade Grande RP</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
}

#login{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

input{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:5px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#2563eb;
    color:white;
}

#dashboard{
    display:none;
}

.sidebar{
    width:200px;
    background:#111827;
    height:100vh;
    position:fixed;
    padding-top:20px;
}

.sidebar button{
    width:90%;
    margin:10px;
}

.content{
    margin-left:220px;
    padding:20px;
}

.staff-item{
    background:#1e293b;
    padding:10px;
    margin:5px 0;
    border-radius:5px;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
    <h2>Login Painel</h2>
    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="login()">Entrar</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
    <div class="sidebar">
        <button onclick="mostrar('home')">Home</button>
        <button onclick="mostrar('staff')">Staff</button>
        <button onclick="mostrar('recrutamento')">Recrutamento</button>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="content">

        <!-- HOME -->
        <div id="home">
            <h1>Bruno / Leticia</h1>
            <h3>DONOS SUPREMOS</h3>
        </div>

        <!-- STAFF -->
        <div id="staff" style="display:none;">
            <h2>Gerenciar Staff</h2>
            <p>Total: <span id="contador">0</span></p>

            <input type="text" id="novoNome" placeholder="Nome">
            <input type="text" id="novoCargo" placeholder="Cargo">
            <button onclick="adicionarStaff()">Adicionar</button>

            <div id="listaStaff"></div>
        </div>

        <!-- RECRUTAMENTO -->
        <div id="recrutamento" style="display:none;">
            <h2>Recrutamento</h2>

            <input type="text" id="recNome" placeholder="Nome">
            <input type="text" id="recCargo" placeholder="Cargo desejado">
            <button onclick="enviarRecrutamento()">Enviar</button>

            <h3>Pendentes</h3>
            <div id="listaPendentes"></div>
        </div>

    </div>
</div>

<script>

let staff = JSON.parse(localStorage.getItem("staff")) || [];
let pendentes = JSON.parse(localStorage.getItem("pendentes")) || [];

function salvar(){
    localStorage.setItem("staff", JSON.stringify(staff));
    localStorage.setItem("pendentes", JSON.stringify(pendentes));
}

function login(){
    const user = document.getElementById("usuario").value;
    const pass = document.getElementById("senha").value;

    if((user === "Bruno" || user === "Leticia") && pass === "BruuLeeh"){
        document.getElementById("login").style.display="none";
        document.getElementById("dashboard").style.display="block";
        atualizarLista();
        atualizarPendentes();
    } else {
        alert("Usuário ou senha incorretos");
    }
}

function logout(){
    location.reload();
}

function mostrar(secao){
    document.getElementById("home").style.display="none";
    document.getElementById("staff").style.display="none";
    document.getElementById("recrutamento").style.display="none";
    document.getElementById(secao).style.display="block";
}

function adicionarStaff(){
    const nome = document.getElementById("novoNome").value;
    const cargo = document.getElementById("novoCargo").value;

    if(nome === "") return;

    staff.push({nome,cargo});
    salvar();
    atualizarLista();
}

function atualizarLista(){
    const lista = document.getElementById("listaStaff");
    lista.innerHTML="";
    document.getElementById("contador").innerText = staff.length;

    staff.forEach((membro,index)=>{
        lista.innerHTML += `
        <div class="staff-item">
            ${membro.nome} - ${membro.cargo}
            <button onclick="remover(${index})" style="background:red;">Remover</button>
        </div>`;
    });
}

function remover(index){
    staff.splice(index,1);
    salvar();
    atualizarLista();
}

function enviarRecrutamento(){
    const nome = document.getElementById("recNome").value;
    const cargo = document.getElementById("recCargo").value;

    if(nome === "") return;

    pendentes.push({nome,cargo});
    salvar();
    atualizarPendentes();
}

function atualizarPendentes(){
    const lista = document.getElementById("listaPendentes");
    lista.innerHTML="";

    pendentes.forEach((membro,index)=>{
        lista.innerHTML += `
        <div class="staff-item">
            ${membro.nome} - ${membro.cargo}
            <button onclick="aprovar(${index})" style="background:green;">Aprovar</button>
            <button onclick="reprovar(${index})" style="background:red;">Reprovar</button>
        </div>`;
    });
}

function aprovar(index){
    staff.push(pendentes[index]);
    pendentes.splice(index,1);
    salvar();
    atualizarLista();
    atualizarPendentes();
}

function reprovar(index){
    pendentes.splice(index,1);
    salvar();
    atualizarPendentes();
}

</script>

</body>
</html>
