<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cidade Grande RP - Painel</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background: linear-gradient(135deg,#000000,#001f3f);
    color:white;
    overflow:hidden;
}

.login-box{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:#111;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 40px #00bfff80;
    width:350px;
    text-align:center;
}

input, select{
    width:100%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    width:100%;
    padding:10px;
    background:#00bfff;
    border:none;
    border-radius:8px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0099ff;
    transform:scale(1.03);
}

.dashboard{
    display:none;
    display:flex;
}

.sidebar{
    width:230px;
    background:#0a0a0a;
    height:100vh;
    padding:20px;
    box-shadow:0 0 20px #00bfff40;
}

.sidebar h3{
    text-align:center;
}

.content{
    flex:1;
    padding:40px;
    overflow-y:auto;
}

.card{
    background:#111;
    padding:25px;
    border-radius:15px;
    margin-bottom:20px;
    box-shadow:0 0 25px #00bfff40;
    animation:fade 0.3s ease-in-out;
}

@keyframes fade{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

.owner-badge{
    background:linear-gradient(90deg,#00bfff,#0080ff);
    padding:5px 10px;
    border-radius:10px;
    display:inline-block;
    margin-top:10px;
}

.staff-item{
    margin-top:10px;
    padding:10px;
    background:#1a1a1a;
    border-radius:8px;
}
</style>
</head>
<body>

<div class="login-box" id="login">
    <div class="box">
        <h2>Cidade Grande RP</h2>
        <input type="text" id="usuario" placeholder="Usuário">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="login()">Entrar</button>
    </div>
</div>

<div class="dashboard" id="dashboard">
    <div class="sidebar">
        <h3>👑 Painel</h3>
        <button onclick="mostrar('home')">Home</button>
        <button onclick="mostrar('staff')">Staff</button>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="content">
        <div id="home" class="card">
            <h2>👑 Donos Oficiais</h2>
            <p><strong>Bruno / Leticia</strong></p>
            <div class="owner-badge">Cargo: DONO SUPREMO</div>
            <p style="margin-top:15px;">Sistema Oficial Cidade Grande RP</p>
        </div>

        <div id="staff" class="card" style="display:none;">
            <h2>Gerenciar Staff</h2>
            <p>Total de membros: <span id="contador">0</span></p>

            <input type="text" id="novoNome" placeholder="Nome do Staff">
            <select id="novoCargo">
                <option>Admin</option>
                <option>Moderador</option>
            </select>
            <button onclick="adicionarStaff()">Adicionar</button>

            <div id="listaStaff"></div>
        </div>
    </div>
</div>

<script>

let staff = JSON.parse(localStorage.getItem("staff")) || [];
let pendentes = JSON.parse(localStorage.getItem("pendentes")) || [];

function salvar(){
    localStorage.setItem("staff", JSON.stringify(staff));
    localStorage.setItem("pendentes", JSON.stringify(pendentes));
}

function login(){
    const user = document.getElementById("usuario").value;
    const pass = document.getElementById("senha").value;

    if((user === "Bruno" || user === "Leticia") && pass === "BruuLeeh"){
        document.getElementById("login").style.display="none";
        document.getElementById("dashboard").style.display="flex";
        atualizarLista();
        atualizarPendentes();
    } else {
        alert("Acesso negado");
    }
}

function logout(){
    location.reload();
}

function mostrar(secao){
    document.getElementById("home").style.display="none";
    document.getElementById("staff").style.display="none";
    document.getElementById("recrutamento").style.display="none";
    document.getElementById(secao).style.display="block";
}

function adicionarStaff(){
    const nome = document.getElementById("novoNome").value;
    const cargo = document.getElementById("novoCargo").value;

    if(nome === "") return;

    staff.push({nome,cargo});
    salvar();
    atualizarLista();
}

function atualizarLista(){
    const lista = document.getElementById("listaStaff");
    lista.innerHTML="";
    document.getElementById("contador").innerText = staff.length;

    staff.forEach((membro,index)=>{
        lista.innerHTML += `
        <div class="staff-item">
            ${membro.nome} - ${membro.cargo}
            <button onclick="remover(${index})" style="background:red;">Remover</button>
        </div>`;
    });
}

function remover(index){
    staff.splice(index,1);
    salvar();
    atualizarLista();
}

function enviarRecrutamento(){
    const nome = document.getElementById("recNome").value;
    const cargo = document.getElementById("recCargo").value;

    if(nome === "") return;

    pendentes.push({nome,cargo});
    salvar();
    atualizarPendentes();
}

function atualizarPendentes(){
    const lista = document.getElementById("listaPendentes");
    lista.innerHTML="";

    pendentes.forEach((membro,index)=>{
        lista.innerHTML += `
        <div class="staff-item">
            ${membro.nome} - ${membro.cargo}
            <button onclick="aprovar(${index})" style="background:green;">Aprovar</button>
            <button onclick="reprovar(${index})" style="background:red;">Reprovar</button>
        </div>`;
    });
}

function aprovar(index){
    staff.push(pendentes[index]);
    pendentes.splice(index,1);
    salvar();
    atualizarLista();
    atualizarPendentes();
}

function reprovar(index){
    pendentes.splice(index,1);
    salvar();
    atualizarPendentes();
}
